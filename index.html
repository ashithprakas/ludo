<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Ludo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23007aff'/><circle cx='30' cy='30' r='9' fill='white'/><circle cx='70' cy='30' r='9' fill='white'/><circle cx='50' cy='50' r='9' fill='white'/><circle cx='30' cy='70' r='9' fill='white'/><circle cx='70' cy='70' r='9' fill='white'/></svg>">
<style>
  :root {
    --bg: #f2f2f7; --bg2: #e5e5ea; --glass: rgba(255,255,255,.72); --glassLine: rgba(60,60,67,.14);
    --label: #1c1c1e; --label2: rgba(60,60,67,.62); --accent: #007aff;
    --c0: #ff3b30; --c1: #34c759; --c2: #ffcc00; --c3: #007aff;
    --cell: #ffffff; --cellLine: #e5e5ea; --slot: #ececf1; --star: #c7c7cc; --boardBg: #ffffff;
    --shadow: 0 10px 40px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
    --spring: cubic-bezier(.34, 1.56, .64, 1); --ease: cubic-bezier(.2, .9, .25, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000; --bg2: #1c1c1e; --glass: rgba(44,44,46,.72); --glassLine: rgba(235,235,245,.14);
      --label: #f5f5f7; --label2: rgba(235,235,245,.6); --accent: #0a84ff;
      --c0: #ff453a; --c1: #30d158; --c2: #ffd60a; --c3: #0a84ff;
      --cell: #2c2c2e; --cellLine: #1c1c1e; --slot: #3a3a3c; --star: #636366; --boardBg: #1c1c1e;
      --shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05);
    }
  }
  :root[data-theme="dark"] {
      --bg: #000; --bg2: #1c1c1e; --glass: rgba(44,44,46,.72); --glassLine: rgba(235,235,245,.14);
      --label: #f5f5f7; --label2: rgba(235,235,245,.6); --accent: #0a84ff;
      --c0: #ff453a; --c1: #30d158; --c2: #ffd60a; --c3: #0a84ff;
      --cell: #2c2c2e; --cellLine: #1c1c1e; --slot: #3a3a3c; --star: #636366; --boardBg: #1c1c1e;
      --shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; color: var(--label); background: var(--bg);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(60vmax 40vmax at 15% -10%, color-mix(in srgb, var(--c3) 16%, transparent), transparent),
                radial-gradient(50vmax 40vmax at 100% 0%, color-mix(in srgb, var(--c0) 12%, transparent), transparent),
                radial-gradient(60vmax 40vmax at 50% 110%, color-mix(in srgb, var(--c1) 12%, transparent), transparent); }
  main { max-width: 560px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom)); }
  [hidden] { display: none !important; }
  .view { animation: enter .55s var(--ease) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(14px) scale(.985); } }

  h1 { font-size: 44px; line-height: 1.05; letter-spacing: -.03em; font-weight: 800; margin: 28px 0 4px; }
  .lead { color: var(--label2); font-size: 19px; margin: 0 0 26px; }
  .group-title { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--label2); margin: 22px 14px 7px; }
  .glass { background: var(--glass); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px);
    border: .5px solid var(--glassLine); border-radius: 20px; box-shadow: var(--shadow); }
  .group { overflow: hidden; }
  .group > * + * { border-top: .5px solid var(--glassLine); }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 52px; }
  .item .grow { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .tag { color: var(--label2); font-size: 15px; }
  input { width: 100%; border: 0; background: transparent; color: var(--label); font: inherit; font-weight: 500; outline: none; padding: 0; }
  input::placeholder { color: var(--label2); }
  input.code { font-weight: 700; letter-spacing: .35em; text-transform: uppercase; font-variant-numeric: tabular-nums; }

  .btn { appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; padding: 15px 22px; border-radius: 14px; color: #fff; background: var(--accent);
    transition: transform .35s var(--spring), filter .2s, opacity .2s; }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.95); }
  .btn:disabled { opacity: .35; pointer-events: none; }
  .btn.sec { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .btn.plain { background: transparent; color: var(--accent); padding: 12px; }
  .btn.danger { color: #ff3b30; }
  .btn.block { width: 100%; }
  .row { display: flex; gap: 10px; }
  .row > .btn { flex: 1; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { appearance: none; font: inherit; color: var(--label); text-align: left; cursor: pointer; padding: 18px; min-height: 150px; display: flex; flex-direction: column; justify-content: space-between;
    transition: transform .4s var(--spring), box-shadow .3s; }
  .tile:active { transform: scale(.96); }
  .tile svg { width: 44px; height: 44px; fill: currentColor; }
  .tile b { display: block; font-size: 19px; letter-spacing: -.01em; }
  .tile small { color: var(--label2); font-size: 14px; }
  .tile.on { box-shadow: 0 0 0 2.5px var(--accent), var(--shadow); }
  .tile.t0 svg { color: var(--c3); } .tile.t1 svg { color: var(--c1); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 12px; background: color-mix(in srgb, var(--label2) 18%, transparent); position: relative; }
  .seg button { appearance: none; border: 0; background: transparent; font: inherit; font-weight: 600; padding: 9px; color: var(--label); cursor: pointer; border-radius: 9px; position: relative; z-index: 1; }
  .seg i { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 9px; background: var(--cell);
    box-shadow: 0 2px 6px rgba(0,0,0,.14); transition: transform .45s var(--spring); }
  .panel { padding: 16px; display: grid; gap: 14px; margin-top: 14px; }

  .c0 { --pc: var(--c0); } .c1 { --pc: var(--c1); } .c2 { --pc: var(--c2); } .c3 { --pc: var(--c3); }
  .avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: #fff;
    background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 78%, #fff), var(--pc)); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55), 0 2px 6px color-mix(in srgb, var(--pc) 45%, transparent); }
  .c2 .avatar { color: #5c4400; }
  .avatar.sm { width: 34px; height: 34px; font-size: 15px; }
  .roomcode { font-size: 50px; font-weight: 800; letter-spacing: .16em; text-align: center; padding: 18px 0 20px; padding-left: .16em; font-variant-numeric: tabular-nums; }
  .x { appearance: none; border: 0; width: 28px; height: 28px; border-radius: 50%; background: color-mix(in srgb, var(--label2) 22%, transparent); color: var(--label2); font-size: 16px; cursor: pointer; line-height: 1; transition: transform .3s var(--spring); }
  .x:active { transform: scale(.85); }
  .pop { animation: pop .5s var(--spring) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.8); } }

  /* ---------- game ---------- */
  #boardWrap { width: min(100%, calc(100vh - 230px), 620px); width: min(100%, calc(100dvh - 230px), 620px); margin: 0 auto; }
  .corners { display: flex; justify-content: space-between; gap: 10px; margin: 8px 0; min-height: 62px; }
  .badge { flex: 1 1 0; min-width: 0; max-width: calc(50% - 5px); display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; border-radius: 999px;
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: .5px solid var(--glassLine);
    transition: transform .5s var(--spring), box-shadow .4s, opacity .3s; opacity: .62; }
  .badge.right { flex-direction: row-reverse; padding: 6px 6px 6px 8px; text-align: right; }
  .badge.active { flex-grow: 1.6; max-width: none; opacity: 1; transform: scale(1.03); box-shadow: 0 0 0 2.5px var(--pc), 0 8px 26px color-mix(in srgb, var(--pc) 40%, transparent); }
  .badge .avatar { width: 46px; height: 46px; }
  .corners[data-n="1"] .badge { max-width: 100%; }
  .info { flex: 1; min-width: 0; }
  @media (max-width: 440px) {
    .badge { gap: 8px; } .badge .avatar { width: 38px; height: 38px; font-size: 16px; } .die { width: 42px; height: 42px; padding: 4px; border-radius: 12px; }
    .pips i { width: 6.5px; height: 6.5px; } .tg { display: none; } .corners { min-height: 54px; }
  }
  .nm { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st { font-size: 12.5px; color: var(--label2); white-space: nowrap; }
  .die { flex: none; width: 50px; height: 50px; padding: 5px; border: 0; border-radius: 14px; cursor: default;
    background: linear-gradient(145deg, #fff, #e4e4ea); color: #111;
    box-shadow: inset 0 -3px 5px rgba(0,0,0,.1), inset 0 2px 3px #fff, 0 4px 10px rgba(0,0,0,.25); animation: dieIn .5s var(--spring) both; }
  .die.rollable { cursor: pointer; animation: dieIn .5s var(--spring) both, breathe 1.3s ease-in-out .5s infinite; box-shadow: inset 0 -3px 5px rgba(0,0,0,.1), inset 0 2px 3px #fff, 0 0 0 3px var(--accent), 0 6px 18px rgba(0,122,255,.5); }
  .die.roll { animation: tumble .62s var(--ease) both; }
  @keyframes dieIn { from { transform: scale(.4) rotate(-40deg); opacity: 0; } }
  @keyframes breathe { 50% { transform: scale(1.1); } }
  @keyframes tumble { 0% { transform: scale(.7) rotate(0); } 45% { transform: scale(1.25) rotate(240deg) translateY(-6px); } 100% { transform: scale(1) rotate(360deg); } }
  .pips { display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); width: 100%; height: 100%; }
  .pips i { place-self: center; width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #555, #111); transform: scale(0); transition: transform .25s var(--spring); }
  .pips i.on { transform: scale(1); }

  #board { width: 100%; aspect-ratio: 1; display: block; border-radius: 26px; background: var(--boardBg); box-shadow: var(--shadow); touch-action: manipulation; }
  .f0 { fill: var(--c0); } .f1 { fill: var(--c1); } .f2 { fill: var(--c2); } .f3 { fill: var(--c3); }
  .cell { fill: var(--cell); stroke: var(--cellLine); stroke-width: .03; }
  .hc { fill-opacity: .92; }
  .inner { fill: var(--cell); }
  .slot { fill: var(--slot); }
  .star { fill: var(--star); } .starw { fill: #fff; }
  .quad { transition: opacity .4s; }
  .shadow { fill: #000; opacity: .22; }
  .rim { fill: none; stroke: rgba(255,255,255,.7); stroke-width: .05; }
  .tok { transition-property: transform; transition-timing-function: cubic-bezier(.4, 0, .2, 1); cursor: default; }
  .tok .ball { transform-box: fill-box; }
  .tok .halo { display: none; transform-box: fill-box; transform-origin: center; }
  .tok.movable { cursor: pointer; }
  .tok.movable .halo { display: block; animation: halo 1.1s ease-in-out infinite; }
  @keyframes halo { 0% { transform: scale(.86); opacity: .55; } 100% { transform: scale(1.22); opacity: .1; } }

  #msg { text-align: center; font-weight: 600; margin: 14px 0 2px; min-height: 1.4em; transition: opacity .25s; }
  #msg.swap { opacity: 0; }
  #hint { text-align: center; color: var(--accent); font-weight: 650; min-height: 1.4em; }
  .bar { display: flex; justify-content: flex-end; gap: 10px; align-items: center; margin-top: 6px; }
  .round, .btn.glass.round { width: 44px; height: 44px; border-radius: 50%; padding: 0; display: grid; place-items: center; color: var(--accent); background: var(--glass); }
  .round svg { width: 22px; height: 22px; }
  #over { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.35); animation: fade .35s both; }
  #over .sheet { width: min(520px, 100%); padding: 10px 22px max(24px, env(safe-area-inset-bottom)); border-radius: 28px 28px 0 0; animation: sheet .6s var(--ease) both;
    background: var(--glass); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); }
  #over .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--label2); opacity: .4; margin: 0 auto 14px; }
  #over h2 { margin: 6px 0 12px; font-size: 28px; letter-spacing: -.02em; text-align: center; }
  #ranking { list-style: none; margin: 0 0 18px; padding: 0; }
  #ranking li { display: flex; align-items: center; gap: 12px; padding: 11px 6px; font-weight: 600; border-top: .5px solid var(--glassLine); }
  #ranking li:first-child { border-top: 0; }
  #ranking .medal { width: 32px; text-align: center; font-size: 24px; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes sheet { from { transform: translateY(100%); } }
  .confetti { position: fixed; top: -12px; width: 9px; height: 14px; border-radius: 2px; z-index: 30; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); opacity: .9; } }
  #toast { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translate(-50%, -80px); z-index: 40; padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 15px;
    background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: .5px solid var(--glassLine); box-shadow: var(--shadow); transition: transform .5s var(--spring); max-width: 92vw; }
  #toast.show { transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<main>
  <section id="home" class="view">
    <div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h1>Ludo</h1>
    <p class="lead">Roll, race and send friends home.</p></div>
      <button class="btn glass round themeBtn" aria-label="Toggle dark mode" style="margin-top:28px"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 14.5A9 9 0 119.5 3a7 7 0 0011.5 11.5z"/></svg></button></div>

    <div class="glass group"><label class="item"><span style="color:var(--label2)">Name</span><input id="name" maxlength="14" placeholder="Your name" autocomplete="off" style="text-align:right"></label></div>

    <div class="group-title">Play</div>
    <div class="tiles">
      <button class="glass tile t0" id="tileFriends">
        <svg viewBox="0 0 48 48"><circle cx="19" cy="17" r="7"/><path d="M5 40c0-9 6-13 14-13s14 4 14 13z"/><circle cx="35" cy="19" r="5" opacity=".55"/><path d="M33 28c7 0 11 3 11 12h-8c0-5-1-9-3-12z" opacity=".55"/></svg>
        <span><b>Friends</b><small>Online, 2–4 players</small></span>
      </button>
      <button class="glass tile t1" id="tileComputer">
        <svg viewBox="0 0 48 48"><rect x="7" y="15" width="34" height="25" rx="9"/><rect x="22.5" y="6" width="3" height="9" rx="1.5"/><circle cx="24" cy="6" r="3"/><circle cx="17" cy="27" r="3.5" style="fill:var(--bg)"/><circle cx="31" cy="27" r="3.5" style="fill:var(--bg)"/></svg>
        <span><b>Computer</b><small>Offline, 1–3 bots</small></span>
      </button>
    </div>

    <div class="glass panel pop" id="friendsPanel" hidden>
      <button class="btn block" id="create">Create Room</button>
      <div class="group-title" style="margin:2px 0 -6px">or join with a code</div>
      <div class="glass group" style="box-shadow:none"><label class="item"><input id="joinCode" class="code" maxlength="5" placeholder="CODE" autocomplete="off"></label></div>
      <button class="btn sec block" id="join">Join Room</button>
    </div>
    <div class="glass panel pop" id="cpuPanel" hidden>
      <div class="group-title" style="margin:0 0 -6px">Opponents</div>
      <div class="seg" id="seg"><i></i><button data-bots="1">1</button><button data-bots="2">2</button><button data-bots="3">3</button></div>
      <button class="btn block" id="playCpu">Play</button>
    </div>
  </section>

  <section id="lobby" class="view" hidden>
    <h1>Lobby</h1>
    <p class="lead" id="lobbySub">Share the code with your friends.</p>
    <div class="glass">
      <div class="roomcode" id="lobbyCode"></div>
      <div style="padding:0 16px 16px"><button class="btn block" id="copy">Copy Invite Link</button></div>
    </div>
    <div class="group-title">Players</div>
    <div class="glass group" id="lobbyPlayers"></div>
    <div class="row" id="hostControls" style="margin-top:18px"><button id="addBot" class="btn sec">Add Bot</button><button id="start" class="btn">Start Game</button></div>
    <p class="lead" id="waitHost" style="text-align:center;margin-top:20px" hidden>Waiting for the host to start…</p>
    <button id="leaveLobby" class="btn plain danger block" style="margin-top:10px">Leave</button>
  </section>

  <section id="game" class="view" hidden>
    <div id="boardWrap">
      <div class="corners"><div class="badge c0" data-c="0"></div><div class="badge right c1" data-c="1"></div></div>
      <svg id="board" viewBox="0 0 15 15" role="img" aria-label="Ludo board"></svg>
      <div class="corners"><div class="badge c3" data-c="3"></div><div class="badge right c2" data-c="2"></div></div>
      <div id="msg"></div>
      <div id="hint"></div>
      <div class="bar">
        <button id="leaveGame" class="btn plain danger" style="margin-right:auto">Leave</button>
        <button class="btn glass round themeBtn" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 14.5A9 9 0 119.5 3a7 7 0 0011.5 11.5z"/></svg></button>
        <button id="mute" class="btn glass round" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><g id="waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 8.5a5 5 0 010 7M18.6 6a8.6 8.6 0 010 12"/></g><path id="slash" d="M17 9l5 6m0-6l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden/></svg></button>
      </div>
    </div>
    <div id="over" hidden>
      <div class="sheet">
        <div class="grab"></div>
        <h2 id="overTitle">Game over</h2>
        <ol id="ranking"></ol>
        <button id="again" class="btn block">Back to Lobby</button>
        <p class="lead" id="againWait" style="text-align:center;margin:0" hidden>Waiting for the host…</p>
        <button id="leaveOver" class="btn plain block" style="margin-top:4px">Leave</button>
      </div>
    </div>
  </section>
</main>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const COLOR_ORDER = [0, 2, 1, 3];            // 2 players sit opposite each other
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const store = {
  get(k, area = localStorage) { try { return area.getItem(k); } catch { return null; } },
  set(k, v, area = localStorage) { try { area.setItem(k, v); } catch {} },
};
const rnd = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => CODE_CHARS[b % CODE_CHARS.length]).join('');
// Per-tab identity so two tabs of one browser are two players; survives a refresh for rejoining.
const cid = store.get('ludo.cid', sessionStorage) || (() => { const c = rnd(16); store.set('ludo.cid', c, sessionStorage); return c; })();

let role = null;          // 'host' | 'guest'
let peer = null, hostConn = null, room = null;
let H = null;             // host-only authoritative state {started, players, game}
const guests = new Map(); // cid -> conn
let S = null;             // view state: {started, players, game}
let me = -1;              // my index in S.players
let timer = null;
let solo = false;         // offline vs-computer: no PeerJS involved
let joinName = '', tries = 0, leaving = false;
const PEER_OPTS = { config: { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' },
  { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' },
  { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turns:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' },
] } };

/* ---------------- sound + haptics ---------------- */

let actx = null, muted = store.get('ludo.mute') === '1';
function tone(f, d = .09, type = 'sine', v = .06, at = 0) {
  if (muted) return;
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d);
  } catch {}
}
const sfx = {
  roll() { for (let i = 0; i < 5; i++) tone(260 + Math.random() * 200, .04, 'triangle', .04, i * .07); },
  step(i = 0) { tone(520 + i * 38, .07, 'sine', .05); },
  out() { tone(660, .1); tone(880, .14, 'sine', .05, .08); },
  home() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'sine', .06, i * .08)); },
  capture() { tone(220, .2, 'sawtooth', .04); tone(150, .28, 'sawtooth', .04, .08); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .3, 'sine', .07, i * .1)); },
};
const buzz = ms => { try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(ms); } catch {} };
function paintMute() { $('#slash').hidden = !muted; $('#waves').style.display = muted ? 'none' : ''; }

function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}
let wl = null;
async function wake() { try { if (!wl && navigator.wakeLock && S) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => (wl = null)); } } catch {} }
function unwake() { try { wl && wl.release(); } catch {} wl = null; }
function show(id) { ['home', 'lobby', 'game'].forEach(s => ($('#' + s).hidden = s !== id)); if (id !== 'home') wake(); }
function myName() { const n = $('#name').value.trim() || 'Player'; store.set('ludo.name', n); return n; }

/* ---------------- networking ---------------- */

function resetNet(msg) {
  leaving = true;
  clearTimeout(timer);
  try { peer && peer.destroy(); } catch {}
  unwake();
  solo = false; role = peer = hostConn = H = S = room = null; me = -1; guests.clear();
  $('#over').hidden = true; $('#tokens')?.remove(); lastRolls = 0; lastTurnKey = '';
  history.replaceState(null, '', location.pathname);
  show('home');
  if (msg) toast(msg);
}

function createSolo(bots) {
  const name = myName();
  solo = true; role = 'host'; room = 'SOLO';
  H = { started: false, players: [mkPlayer(name, cid)], game: null };
  for (let i = 1; i <= bots; i++) H.players.push(mkPlayer('Bot ' + i, null, true));
  startGame();
}

function createRoom() {
  const name = myName();
  room = rnd(5);
  peer = new Peer('ludo-' + room, PEER_OPTS);
  peer.on('open', () => {
    role = 'host';
    H = { started: false, players: [mkPlayer(name, cid)], game: null };
    H.players[0].host = true;
    $('#lobbyCode').textContent = room;
    show('lobby');
    commit();
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
  peer.on('connection', c => {
    c.on('data', m => onGuestMsg(c, m));
    c.on('close', () => onGuestClose(c));
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); createRoom(); }
    else if (role === 'host') toast('Network error: ' + e.type);
    else resetNet('Could not create a room (' + e.type + ')');
  });
}

function joinRoom(code) {
  joinName = myName(); room = code; leaving = false; tries = 0;
  peer = new Peer(PEER_OPTS);
  const fail = setTimeout(() => !hostConn?.open && resetNet("Couldn't connect. Check the code and that the host still has the game open."), 15000);
  peer.on('open', () => { clearTimeout(fail); dial(); });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
  peer.on('error', e => {
    if (role === 'guest' && e.type !== 'peer-unavailable') return retry();   // already in a room: try to recover
    clearTimeout(fail);
    resetNet(e.type === 'peer-unavailable' ? `Room ${code} not found` : 'Network error: ' + e.type);
  });
}

function dial() {
  hostConn = peer.connect('ludo-' + room, { reliable: true });
  hostConn.on('open', () => { tries = 0; role = 'guest'; hostConn.send({ t: 'join', cid, name: joinName }); });
  hostConn.on('data', onHostMsg);
  hostConn.on('close', () => role === 'guest' && retry());
}

// Phones drop connections when the tab is backgrounded; rejoin with the same cid to get the seat back.
function retry() {
  if (role !== 'guest' || leaving) return;
  if (tries++ >= 8) return resetNet('Lost connection to the host');
  toast('Reconnecting…');
  setTimeout(() => {
    if (role !== 'guest') return;
    if (peer.destroyed) { peer = new Peer(PEER_OPTS); peer.on('open', dial); peer.on('error', retry); }
    else if (peer.disconnected) { peer.once('open', dial); try { peer.reconnect(); } catch { retry(); } }
    else dial();
  }, 1500);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (role === 'guest' && !(hostConn && hostConn.open)) retry(); wake(); }
});

function onHostMsg(m) {
  if (m.t === 'sync') {
    S = m.st; me = m.you;
    $('#lobbyCode').textContent = room;
    render();
  } else if (m.t === 'err') {
    resetNet(m.m);
  }
}

function onGuestMsg(c, m) {
  if (m.t === 'join') {
    let i = H.players.findIndex(p => p.cid === m.cid);
    if (i < 0) {
      if (H.started) return c.send({ t: 'err', m: 'Game already in progress' });
      if (H.players.length >= 4) return c.send({ t: 'err', m: 'Room is full' });
      H.players.push(mkPlayer(String(m.name).slice(0, 14), m.cid));
    } else {
      H.players[i].connected = true;
    }
    c.cid = m.cid;
    const old = guests.get(m.cid);
    guests.set(m.cid, c);
    if (old && old !== c) try { old.close(); } catch {}
    commit();
    return;
  }
  const i = H.players.findIndex(p => p.cid === c.cid);
  if (i < 0) return;
  if (m.t === 'roll') hostRoll(i);
  else if (m.t === 'move') hostMove(i, m.i);
}

function onGuestClose(c) {
  if (!c.cid || guests.get(c.cid) !== c || !H) return;
  guests.delete(c.cid);
  const i = H.players.findIndex(p => p.cid === c.cid);
  if (i < 0) return;
  if (H.started) H.players[i].connected = false;
  else H.players.splice(i, 1);
  commit();
}

/* ---------------- host logic ---------------- */

function mkPlayer(name, id, bot = false) {
  const used = H ? H.players.map(p => p.color) : [];
  const color = COLOR_ORDER.find(c => !used.includes(c));
  return { name, color, bot, cid: id, connected: true };
}

const pub = () => {
  const st = JSON.parse(JSON.stringify({ started: H.started, players: H.players, game: H.game }));
  st.players.forEach(p => delete p.cid);
  if (st.game) st.game.players.forEach(p => delete p.cid);
  return st;
};

function commit() {
  S = pub(); me = H.players.findIndex(p => p.cid === cid);
  guests.forEach((c, id) => c.open && c.send({ t: 'sync', st: S, you: H.players.findIndex(p => p.cid === id) }));
  render();
  schedule();
}

// Delays leave room for the token-walk animation (~150ms per cell) before the next action.
function schedule() {
  clearTimeout(timer);
  const g = H.game;
  if (!H.started || !g || g.phase === 'over') return;
  const p = g.players[g.turn];
  const auto = p.bot || !p.connected;
  if (g.phase === 'move') {
    if (!Ludo.legalMoves(g).length) timer = setTimeout(() => { Ludo.pass(g); commit(); }, 1400);
    else if (auto) timer = setTimeout(() => hostMove(g.turn, Ludo.botMove(g)), 1100);
  } else if (auto) {
    timer = setTimeout(() => hostRoll(g.turn), 1000);
  }
}

function hostRoll(i) {
  const g = H.game;
  if (!g || g.turn !== i) return;
  if (Ludo.roll(g, 1 + Math.floor(Math.random() * 6))) commit();
}
function hostMove(i, tok) {
  const g = H.game;
  if (!g || g.turn !== i) return;
  if (Ludo.move(g, tok)) commit();
}

function startGame() {
  if (H.players.length < 2) return toast('Need at least 2 players');
  H.players.sort((a, b) => a.color - b.color);
  H.game = Ludo.newGame(H.players);
  H.players = H.game.players; // game.players aliases the lobby list from here on
  H.started = true;
  commit();
}

function backToLobby() {
  H.started = false; H.game = null;
  H.players = H.players.filter(p => p.bot || p.connected);
  $('#over').hidden = true; $('#tokens')?.remove();
  commit();
}

/* ---------------- board ---------------- */

const SVGNS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent && parent.appendChild(n);
  return n;
};

const PATH = [];
(function () {
  const seg = (c, r, dc, dr, n) => { for (let i = 0; i < n; i++) PATH.push([c + dc * i, r + dr * i]); };
  seg(1, 6, 1, 0, 5); seg(6, 5, 0, -1, 6); seg(7, 0, 1, 0, 2); seg(8, 1, 0, 1, 5);
  seg(9, 6, 1, 0, 6); seg(14, 7, 0, 1, 2); seg(13, 8, -1, 0, 5); seg(8, 9, 0, 1, 6);
  seg(7, 14, -1, 0, 2); seg(6, 13, 0, -1, 5); seg(5, 8, -1, 0, 6); seg(0, 7, 0, -1, 2);
})();
const HOME = [
  [1, 2, 3, 4, 5].map(c => [c, 7]),
  [1, 2, 3, 4, 5].map(r => [7, r]),
  [13, 12, 11, 10, 9].map(c => [c, 7]),
  [13, 12, 11, 10, 9].map(r => [7, r]),
];
const QUAD = [[0, 0], [9, 0], [9, 9], [0, 9]];
const SLOT = [[2, 2], [4, 2], [2, 4], [4, 4]];
const FIN_DIR = [[-1, 0], [0, -1], [1, 0], [0, 1]];   // toward each color's own triangle
// Four finished pieces sit in a row inside their color's triangle, never on top of each other.
const finSlot = (color, k) => {
  const [dx, dy] = FIN_DIR[color], l = (k - 1.5) * .62, d = 1.1;
  return [dx * d + dy * l, dy * d + dx * l];
};

function drawBoard() {
  const svg = $('#board');
  svg.innerHTML = `<defs>
    <radialGradient id="shine" cx=".34" cy=".28" r=".62"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="bodyShade" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".34"/></linearGradient>
    <radialGradient id="shade" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient></defs>`;
  const bg = el('g', {}, svg);
  QUAD.forEach(([qx, qy], c) => {
    el('rect', { x: qx + .1, y: qy + .1, width: 5.8, height: 5.8, rx: .75, class: `quad f${c}`, id: 'quad' + c }, bg);
    el('rect', { x: qx + .95, y: qy + .95, width: 4.1, height: 4.1, rx: .55, class: 'inner' }, bg);
    SLOT.forEach(([sx, sy]) => el('circle', { cx: qx + sx, cy: qy + sy, r: .56, class: 'slot' }, bg));
  });
  const cell = (c, r, cls) => el('rect', { x: c + .035, y: r + .035, width: .93, height: .93, rx: .16, class: cls }, bg);
  const star = (c, r, cls) => el('polygon', {
    class: cls,
    points: Array.from({ length: 10 }, (_, k) => {
      const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? .17 : .37;
      return `${(c + .5 + Math.cos(a) * rad).toFixed(3)},${(r + .53 + Math.sin(a) * rad).toFixed(3)}`;
    }).join(' '),
  }, bg);
  PATH.forEach(([c, r], i) => {
    const start = i % 13 === 0;
    cell(c, r, start ? `f${i / 13}` : 'cell');
    if (start) star(c, r, 'starw');
    else if (i % 13 === 8) star(c, r, 'star');
  });
  HOME.forEach((cells, c) => cells.forEach(([x, y]) => cell(x, y, `f${c} hc`)));
  [[0, 7, 0], [7, 0, 90], [14, 7, 180], [7, 14, 270]].forEach(([c, r, rot], k) => {
    el('path', { d: 'M-.26,-.1 H.04 V-.25 L.3,0 L.04,.25 V.1 H-.26 Z', class: `f${k}`, transform: `translate(${c + .5} ${r + .5}) rotate(${rot})` }, bg);
  });
  [[[6, 6], [6, 9]], [[6, 6], [9, 6]], [[9, 6], [9, 9]], [[6, 9], [9, 9]]].forEach((pts, c) => {
    el('polygon', { points: [...pts, [7.5, 7.5]].map(p => p.join(',')).join(' '), class: `f${c}`, 'stroke-linejoin': 'round', stroke: 'var(--boardBg)', 'stroke-width': .06 }, bg);
  });
  el('g', { id: 'tokens' }, svg);
}

function tokenXY(color, pos, ti) {
  if (pos === -1) return [QUAD[color][0] + SLOT[ti][0], QUAD[color][1] + SLOT[ti][1]];
  if (pos <= 50) { const [c, r] = PATH[Ludo.abs(color, pos)]; return [c + .5, r + .5]; }
  if (pos < 56) { const [c, r] = HOME[color][pos - 51]; return [c + .5, r + .5]; }
  return [7.5, 7.5]; // finished pieces are fanned out by finSlot()
}

function place(node, pos, ms) {
  const [x, y] = tokenXY(node._color, pos, node._ti);
  node.style.transitionDuration = ms + 'ms';
  node.style.transform = `translate(${x + node._ox}px, ${y + node._oy - .03}px) scale(${node._sc})`;
}

// Walks a token cell by cell toward its latest target, so a roll of 5 is five hops, not a slide.
async function drive(node) {
  if (node._run) return;
  node._run = true;
  while (node._cur !== node._target) {
    const from = node._cur, to = node._target;
    let next = to, ms = 450;
    if (from >= 0 && to > from) { next = from + 1; ms = 150; }
    else if (from === -1 && to === 0) { ms = 320; }
    node._cur = next;
    place(node, next, ms);
    if (ms === 150) {
      node._ball.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-.3px) scale(1.12)' }, { transform: 'translateY(0)' }], { duration: 150, easing: 'ease-out' });
      sfx.step(next % 10);
    } else if (from === -1) sfx.out();
    else sfx.capture();
    await sleep(ms + 8);
  }
  if (node._cur === 56) { sfx.home(); node._ball.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.34,1.56,.64,1)' }); }
  place(node, node._cur, 220);
  node._run = false;
}

function makeToken(layer, pl, ti) {
  const id = `tok-${pl.color}-${ti}`;
  const node = el('g', { id, class: 'tok' }, layer);
  node._color = pl.color; node._ti = ti; node._ox = node._oy = 0; node._sc = 1;
  const c = pl.color;
  el('ellipse', { cx: 0, cy: .34, rx: .34, ry: .1, class: 'shadow' }, node);
  const ball = el('g', { class: 'ball' }, node);
  el('ellipse', { cx: 0, cy: .3, rx: .46, ry: .2, class: `halo f${c}` }, ball);
  // pawn: base disc, flared body, collar, head
  el('ellipse', { cx: 0, cy: .3, rx: .31, ry: .1, class: `f${c}` }, ball);
  el('ellipse', { cx: 0, cy: .3, rx: .31, ry: .1, fill: '#000', opacity: .28 }, ball);
  const body = 'M-.27,.29 C-.22,.1 -.12,-.06 -.09,-.14 L.09,-.14 C.12,-.06 .22,.1 .27,.29 Z';
  el('path', { d: body, class: `f${c}` }, ball);
  el('path', { d: body, fill: 'url(#bodyShade)' }, ball);
  el('ellipse', { cx: 0, cy: -.14, rx: .15, ry: .05, class: `f${c}` }, ball);
  el('ellipse', { cx: 0, cy: -.14, rx: .15, ry: .05, fill: '#fff', opacity: .38 }, ball);
  [`f${c}`, null, null].forEach((cls, k) => el('circle', { cx: 0, cy: -.3, r: .19, ...(cls ? { class: cls } : { fill: `url(#${k === 1 ? 'shade' : 'shine'})` }) }, ball));
  node._ball = ball;
  node.addEventListener('click', () => onTokenClick(pl.color, ti));
  return node;
}

function renderBoard(g, legal) {
  const layer = $('#tokens');
  const seen = new Set();
  const groups = {};
  g.players.forEach((pl, pi) => g.tokens[pi].forEach((pos, ti) => {
    const [x, y] = tokenXY(pl.color, pos, ti);
    (groups[x + ',' + y] ||= []).push({ pl, pi, ti, pos });
  }));
  const offs = [[-.2, -.2], [.2, -.2], [-.2, .2], [.2, .2]];
  Object.values(groups).forEach(list => list.forEach((t, k) => {
    const id = `tok-${t.pl.color}-${t.ti}`;
    seen.add(id);
    let node = document.getElementById(id), fresh = !node;
    if (fresh) node = makeToken(layer, t.pl, t.ti);
    const finished = t.pos === Ludo.FIN;
    const stacked = list.length > 1 && t.pos !== -1 && !finished;
    if (finished) {
      const rank = g.tokens[t.pi].slice(0, t.ti).filter(x => x === Ludo.FIN).length;
      [node._ox, node._oy] = finSlot(t.pl.color, rank);
    } else [node._ox, node._oy] = stacked ? offs[k % 4] : [0, 0];
    node._sc = finished ? .5 : stacked ? .74 : 1;
    node._target = t.pos;
    if (fresh) { node._cur = t.pos; place(node, t.pos, 0); }
    else if (node._cur !== node._target) drive(node);
    else if (!node._run) place(node, node._cur, 260);
    node.classList.toggle('movable', g.phase === 'move' && g.turn === me && t.pi === me && legal.includes(t.ti));
  }));
  [...layer.children].forEach(n => !seen.has(n.id) && n.remove());
  for (let c = 0; c < 4; c++) {
    const q = document.getElementById('quad' + c);
    if (q) q.style.opacity = g.players.some(p => p.color === c) ? 1 : .25;
  }
}

function onTokenClick(color, ti) {
  const g = S && S.game;
  if (!g || g.phase !== 'move' || g.turn !== me || g.players[me].color !== color) return;
  if (!Ludo.legalMoves(g).includes(ti)) return;
  buzz(12);
  if (role === 'host') hostMove(me, ti); else hostConn.send({ t: 'move', i: ti });
}

/* ---------------- rendering ---------------- */

const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const pipsHTML = v => `<span class="pips">${Array.from({ length: 9 }, (_, i) => `<i${(PIPS[v] || []).includes(i) ? ' class="on"' : ''}></i>`).join('')}</span>`;

function setDie(die, v, animate) {
  die._v = v;
  if (animate) {
    die.classList.remove('roll'); void die.offsetWidth; die.classList.add('roll');
    die._busy = true; let n = 0; clearInterval(die._iv);
    sfx.roll();
    die._iv = setInterval(() => {
      if (++n >= 7) { clearInterval(die._iv); die._busy = false; die.innerHTML = pipsHTML(die._v); return; }
      die.innerHTML = pipsHTML(1 + Math.floor(Math.random() * 6));
    }, 75);
  } else if (!die._busy) {
    die.innerHTML = pipsHTML(v);
  }
}

let lastRolls = 0, lastTurnKey = '';
function renderBadges(g) {
  const rolled = g.rolls !== lastRolls && g.dice;
  document.querySelectorAll('.badge').forEach(b => {
    const c = +b.dataset.c;
    const pi = g.players.findIndex(p => p.color === c);
    if (pi < 0) { b.style.display = 'none'; return; }
    if (!b.firstChild) {
      b.innerHTML = '<div class="avatar"></div><div class="info"><div class="nm"></div><div class="st"></div></div><button class="die" hidden></button>';
    }
    b.style.display = '';
    const p = g.players[pi];
    const active = g.phase !== 'over' && g.turn === pi;
    const home = g.tokens[pi].filter(x => x === Ludo.FIN).length;
    const tags = [pi === me ? 'you' : '', p.bot ? 'bot' : '', !p.connected ? 'offline' : ''].filter(Boolean).join(' · ');
    b.classList.toggle('active', active);
    b.querySelector('.avatar').textContent = [...p.name][0] || '?';
    b.querySelector('.nm').textContent = p.name;
    b.querySelector('.st').innerHTML = `${home}/4 home${tags ? `<span class="tg"> · ${tags}</span>` : ''}`;
    const die = b.querySelector('.die');
    const rollable = active && pi === me && g.phase === 'roll';
    die.hidden = !active;
    die.disabled = !rollable;
    die.classList.toggle('rollable', rollable);
    if (active) {
      const v = g.dice || 5; // idle die keeps the last roll rather than a blank face
      setDie(die, v, rolled && g.phase === 'move' && !die._busy);
    }
  });
  document.querySelectorAll('.corners').forEach(c => (c.dataset.n = [...c.children].filter(x => x.style.display !== 'none').length));
  lastRolls = g.rolls;
}

function setMsg(text) {
  const m = $('#msg');
  if (m.textContent === text) return;
  m.classList.add('swap');
  setTimeout(() => { m.textContent = text; m.classList.remove('swap'); }, 120);
}

function confetti() {
  const cols = ['--c0', '--c1', '--c2', '--c3'];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('div');
    p.className = 'confetti';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = `var(${cols[i % 4]})`;
    p.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    p.style.animationDuration = 2.2 + Math.random() * 1.8 + 's';
    p.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 5000);
  }
}

function render() {
  if (!S) return;
  if (!S.started) return renderLobby();
  show('game');
  if (!$('#tokens')) drawBoard();
  const g = S.game;
  const legal = Ludo.legalMoves(g);
  renderBoard(g, legal);
  renderBadges(g);
  setMsg(g.msg);
  const myTurn = g.phase !== 'over' && g.turn === me;
  const key = g.turn + ':' + g.phase;
  if (myTurn && key !== lastTurnKey && g.phase === 'roll') buzz(8);
  lastTurnKey = key;
  $('#hint').textContent = !myTurn ? '' : g.phase === 'roll' ? 'Your turn — tap your dice' : legal.length ? 'Tap a glowing piece' : '';

  const over = g.phase === 'over';
  if (over && $('#over').hidden) {
    $('#over').hidden = false;
    const medals = ['🥇', '🥈', '🥉', ''];
    $('#overTitle').textContent = g.ranking[0] === me ? 'You won!' : `${g.players[g.ranking[0]].name} wins`;
    $('#ranking').innerHTML = g.ranking.map((i, k) => `<li class="c${g.players[i].color}"><span class="medal">${medals[k] || k + 1}</span><span class="avatar sm">${esc([...g.players[i].name][0] || '?')}</span>${esc(g.players[i].name)}</li>`).join('');
    $('#again').hidden = role !== 'host' || solo;
    $('#againWait').hidden = role === 'host';
    setTimeout(() => { sfx.win(); if (g.ranking[0] === me) confetti(); }, 700);
  } else if (!over) $('#over').hidden = true;
}

function renderLobby() {
  show('lobby');
  const host = role === 'host';
  $('#lobbyPlayers').innerHTML = S.players.map((p, i) => {
    const tags = [p.host ? 'host' : '', i === me ? 'you' : '', p.bot ? 'bot' : '', !p.connected ? 'offline' : ''].filter(Boolean).join(' · ');
    const rm = host && p.bot ? `<button class="x" data-rm="${i}" aria-label="Remove">×</button>` : '';
    return `<div class="item c${p.color} pop"><span class="avatar sm">${esc([...p.name][0] || '?')}</span><span class="grow">${esc(p.name)}</span><span class="tag">${tags}</span>${rm}</div>`;
  }).join('');
  $('#hostControls').hidden = !host;
  $('#waitHost').hidden = host;
  $('#addBot').disabled = S.players.length >= 4;
  $('#start').disabled = S.players.length < 2;
  $('#lobbySub').textContent = S.players.length < 2 ? 'Share the code, or add a bot to play right now.' : `${S.players.length} players ready.`;
}

/* ---------------- wiring ---------------- */

$('#name').value = store.get('ludo.name') || '';
const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom) $('#joinCode').value = urlRoom.toUpperCase().slice(0, 5);

let selBots = 1;
const paintSeg = () => {
  $('#seg i').style.transform = `translateX(${(selBots - 1) * 100}%)`;
  document.querySelectorAll('#seg button').forEach(b => (b.style.fontWeight = +b.dataset.bots === selBots ? 700 : 600));
};
const pick = id => {
  $('#friendsPanel').hidden = id !== 'friends'; $('#cpuPanel').hidden = id !== 'cpu';
  $('#tileFriends').classList.toggle('on', id === 'friends'); $('#tileComputer').classList.toggle('on', id === 'cpu');
  if (id === 'cpu') paintSeg();
};
$('#tileFriends').onclick = () => pick('friends');
$('#tileComputer').onclick = () => pick('cpu');
$('#seg').onclick = e => { const n = +(e.target.dataset && e.target.dataset.bots); if (n) { selBots = n; paintSeg(); } };
$('#playCpu').onclick = () => createSolo(selBots);
if (urlRoom) pick('friends');

$('#create').onclick = createRoom;
$('#join').onclick = () => {
  const code = $('#joinCode').value.trim().toUpperCase();
  if (code.length !== 5) return toast('Enter the 5-character room code');
  joinRoom(code);
};
$('#joinCode').addEventListener('keydown', e => e.key === 'Enter' && $('#join').click());
$('#copy').onclick = async () => {
  const url = `${location.origin}${location.pathname}?room=${room}`;
  try { await navigator.clipboard.writeText(url); toast('Invite link copied'); } catch { toast(url); }
};
$('#addBot').onclick = () => {
  const n = H.players.filter(p => p.bot).length + 1;
  H.players.push(mkPlayer('Bot ' + n, null, true));
  commit();
};
$('#lobbyPlayers').onclick = e => {
  const i = e.target.dataset && e.target.dataset.rm;
  if (i != null && role === 'host') { H.players.splice(+i, 1); commit(); }
};
$('#start').onclick = startGame;
$('#boardWrap').addEventListener('click', e => {
  if (!e.target.closest('.die.rollable')) return;
  buzz(15);
  if (role === 'host') hostRoll(me); else hostConn.send({ t: 'roll' });
});
$('#again').onclick = backToLobby;
$('#leaveLobby').onclick = () => resetNet();
$('#leaveOver').onclick = () => resetNet();
$('#leaveGame').onclick = () => confirm('Leave this game?') && resetNet();
$('#mute').onclick = () => { muted = !muted; store.set('ludo.mute', muted ? '1' : '0'); paintMute(); if (!muted) sfx.step(3); };
paintMute();

const root = document.documentElement;
const sysDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : sysDark.matches;
const paintTheme = () => document.querySelectorAll('meta[name=theme-color]').forEach(m => m.setAttribute('content', isDark() ? '#000000' : '#f2f2f7'));
const savedTheme = store.get('ludo.theme');
if (savedTheme) root.dataset.theme = savedTheme;
paintTheme();
document.querySelectorAll('.themeBtn').forEach(b => (b.onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  root.dataset.theme = next; store.set('ludo.theme', next); paintTheme();
}));
</script>
</body>
</html>
