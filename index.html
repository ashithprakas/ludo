<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludo Online</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<style>
  :root { --gold: #f7c948; --ink: #0b0830; --panel: #1b1450; --line: #4b3fa0; --text: #f1ecff; --muted: #a79fd6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; color: var(--text); font: 16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; min-height: 100vh;
    background:
      radial-gradient(1.5px 1.5px at 20px 30px, #fff9, transparent), radial-gradient(1px 1px at 90px 120px, #fff8, transparent),
      radial-gradient(1.5px 1.5px at 160px 60px, #fff7, transparent), radial-gradient(1px 1px at 60px 170px, #fff6, transparent),
      radial-gradient(ellipse at 50% 0%, #3a2896 0%, #1a1058 45%, #0b0830 100%);
    background-size: 200px 200px, 200px 200px, 200px 200px, 200px 200px, 100% 100%; background-attachment: fixed; }
  main { max-width: 560px; margin: 0 auto; padding: 14px; }
  [hidden] { display: none !important; }
  .logo { font-size: 56px; margin: 18px 0 0; text-align: center; font-weight: 900; letter-spacing: .08em;
    background: linear-gradient(#fff2a8, #f7a600); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #7a3b00); }
  .sub { color: var(--muted); text-align: center; margin: 4px 0 18px; }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .stack { display: grid; gap: 12px; }
  input { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--ink); color: var(--text); font-size: 16px; }
  input.code { text-transform: uppercase; letter-spacing: .3em; text-align: center; font-weight: 800; }
  button { padding: 12px 18px; border-radius: 12px; border: 0; font-weight: 800; font-size: 16px; cursor: pointer; color: #3a2400;
    background: linear-gradient(#ffe27a, #f2b01e); box-shadow: 0 3px 0 #9a6200; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #9a6200; }
  button.ghost { background: transparent; color: var(--text); border: 2px solid var(--line); box-shadow: none; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > input { flex: 1; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .tile { padding: 18px 8px; font-size: 14px; letter-spacing: .04em; color: #fff; border: 3px solid var(--gold); border-radius: 18px;
    background: linear-gradient(#2a64c8, #123a8c); box-shadow: 0 0 14px #f7c94888, inset 0 2px 0 #fff4; text-shadow: 0 2px 0 #0008; }
  .tile .ic { display: block; font-size: 42px; margin-bottom: 6px; }
  .tile.on { box-shadow: 0 0 22px #f7c948, inset 0 2px 0 #fff4; }
  .opp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; }
  .c0 { --pc: #e53935; } .c1 { --pc: #2e9d3a; } .c2 { --pc: #f2c230; } .c3 { --pc: #2f8de4; }
  .dot { background: var(--pc); }
  .plist { display: grid; gap: 8px; }
  .pl { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--ink); }
  .pl .name { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl .tag { color: var(--muted); font-size: 13px; }
  .pl .x { padding: 2px 10px; background: transparent; color: var(--text); border: 2px solid var(--line); box-shadow: none; }
  .roomcode { font-size: 44px; font-weight: 900; letter-spacing: .2em; text-align: center; margin: 4px 0 12px; color: var(--gold); }

  #boardWrap { width: min(100%, calc(100vh - 210px), 640px); margin: 0 auto; }
  .corners { display: flex; justify-content: space-between; gap: 8px; margin: 6px 0; min-height: 58px; }
  .badge { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; min-width: 0; flex: 1 1 0; max-width: 49%;
    border-radius: 999px; background: var(--panel); border: 2px solid var(--pc); transition: box-shadow .25s; }
  .badge.right { flex-direction: row-reverse; padding: 5px 5px 5px 12px; text-align: right; }
  .badge.active { box-shadow: 0 0 16px 2px var(--pc), inset 0 0 12px #fff2; }
  .avatar { width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--pc); border: 3px solid #fff; display: grid; place-items: center; font-weight: 900; font-size: 20px; color: #fff; text-shadow: 0 1px 2px #0007; }
  .info { min-width: 0; flex: 1; }
  .nm { font-weight: 800; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .die { flex: none; width: 46px; height: 46px; padding: 4px; border-radius: 11px; background: linear-gradient(#fff, #d9d9e8); box-shadow: 0 3px 0 #8a8aa8, 0 0 0 2px #0003; }
  .die:disabled { opacity: 1; cursor: default; }
  .die.rollable { animation: pulse .7s ease-in-out infinite alternate; box-shadow: 0 3px 0 #8a8aa8, 0 0 0 3px var(--gold), 0 0 16px var(--gold); cursor: pointer; }
  .die.shake .pips { animation: shake .5s; }
  .pips { display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); width: 100%; height: 100%; }
  .pips i { place-self: center; width: 7px; height: 7px; border-radius: 50%; background: transparent; }
  .pips i.on { background: #222; }
  @keyframes pulse { to { transform: scale(1.12); } }
  @keyframes shake { 0% { transform: rotate(0) scale(.6); } 50% { transform: rotate(220deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }

  #board { width: 100%; aspect-ratio: 1; display: block; border-radius: 10px; border: 4px solid #fff; background: #fff; box-shadow: 0 8px 30px #0009; touch-action: manipulation; }
  .tok { transition: transform .35s cubic-bezier(.3,.8,.3,1); }
  .tok .base { display: none; fill: none; stroke: #fff; stroke-width: .07; }
  .tok.movable { cursor: pointer; }
  .tok.movable .base { display: block; animation: ring .6s ease-in-out infinite alternate; }
  .tok.movable .pin { animation: hop .6s ease-in-out infinite alternate; }
  @keyframes hop { to { transform: translateY(-.16px); } }
  @keyframes ring { to { stroke-width: .13; } }
  #msg { text-align: center; font-weight: 700; margin: 10px 0 4px; min-height: 2.6em; }
  #hint { text-align: center; color: var(--gold); font-weight: 800; min-height: 1.4em; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #000a; padding: 16px; z-index: 5; }
  #over .card { width: min(380px, 100%); text-align: center; border-color: var(--gold); }
  #over ol { text-align: left; font-size: 18px; font-weight: 700; padding-left: 28px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #0b0830; border: 2px solid var(--line); padding: 10px 16px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; z-index: 9; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <section id="home">
    <h1 class="logo">LUDO</h1>
    <p class="sub">Play with friends online · no sign-up</p>
    <div class="card stack">
      <h2>Your name</h2>
      <input id="name" maxlength="14" placeholder="Name" autocomplete="off">
    </div>
    <div class="tiles">
      <button class="tile" id="tileFriends"><span class="ic">👥</span>PLAY WITH FRIENDS</button>
      <button class="tile" id="tileComputer"><span class="ic">🤖</span>VS COMPUTER</button>
    </div>
    <div class="card stack" id="friendsPanel" hidden>
      <h2>Host a game</h2>
      <button id="create">Create room</button>
      <h2>Or join one</h2>
      <div class="row"><input id="joinCode" class="code" maxlength="5" placeholder="CODE" autocomplete="off"><button id="join">Join</button></div>
    </div>
    <div class="card stack" id="cpuPanel" hidden>
      <h2>Opponents</h2>
      <div class="opp"><button data-bots="1">1</button><button data-bots="2">2</button><button data-bots="3">3</button></div>
    </div>
  </section>

  <section id="lobby" hidden>
    <div class="card">
      <h2>Room code</h2>
      <div class="roomcode" id="lobbyCode"></div>
      <div class="row"><button id="copy" style="flex:1">Copy invite link</button><button id="leaveLobby" class="ghost">Leave</button></div>
    </div>
    <div class="card">
      <h2>Players (2–4)</h2>
      <div class="plist" id="lobbyPlayers"></div>
    </div>
    <div class="card stack" id="hostControls">
      <div class="row"><button id="addBot" class="ghost" style="flex:1">+ Add bot</button><button id="start" style="flex:1">Start game</button></div>
    </div>
    <p class="sub" id="waitHost" hidden>Waiting for the host to start…</p>
  </section>

  <section id="game" hidden>
    <div id="boardWrap">
      <div class="corners"><div class="badge c0" data-c="0"></div><div class="badge right c1" data-c="1"></div></div>
      <svg id="board" viewBox="0 0 15 15" role="img" aria-label="Ludo board"></svg>
      <div class="corners"><div class="badge c3" data-c="3"></div><div class="badge right c2" data-c="2"></div></div>
      <div id="msg"></div>
      <div id="hint"></div>
      <button id="leaveGame" class="ghost" style="width:100%">Leave game</button>
    </div>
    <div id="over" hidden>
      <div class="card">
        <h2>Game over</h2>
        <ol id="ranking"></ol>
        <button id="again">Back to lobby</button>
        <p class="sub" id="againWait" hidden>Waiting for the host…</p>
        <button id="leaveOver" class="ghost" style="margin-top:8px">Leave</button>
      </div>
    </div>
  </section>
</main>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const COLOR_HEX = ['#e53935', '#2e9d3a', '#f2c230', '#2f8de4'];
const COLOR_DARK = ['#8e1b19', '#17621f', '#9a7508', '#164f93'];
const COLOR_ORDER = [0, 2, 1, 3];            // 2 players sit opposite each other
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const FACES = '⚀⚁⚂⚃⚄⚅';

const store = {
  get(k, area = localStorage) { try { return area.getItem(k); } catch { return null; } },
  set(k, v, area = localStorage) { try { area.setItem(k, v); } catch {} },
};
const rnd = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => CODE_CHARS[b % CODE_CHARS.length]).join('');
// Per-tab identity so two tabs of one browser are two players; survives a refresh for rejoining.
const cid = store.get('ludo.cid', sessionStorage) || (() => { const c = rnd(16); store.set('ludo.cid', c, sessionStorage); return c; })();

let role = null;          // 'host' | 'guest'
let peer = null, hostConn = null, room = null;
let H = null;             // host-only authoritative state {started, players, game}
const guests = new Map(); // cid -> conn
let S = null;             // view state: {started, players, game}
let me = -1;              // my index in S.players
let timer = null;
let solo = false;         // offline vs-computer: no PeerJS involved

function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}
function show(id) { ['home', 'lobby', 'game'].forEach(s => ($('#' + s).hidden = s !== id)); }
function myName() { const n = $('#name').value.trim() || 'Player'; store.set('ludo.name', n); return n; }

/* ---------------- networking ---------------- */

function resetNet(msg) {
  clearTimeout(timer);
  try { peer && peer.destroy(); } catch {}
  solo = false; role = peer = hostConn = H = S = room = null; me = -1; guests.clear();
  history.replaceState(null, '', location.pathname);
  show('home');
  if (msg) toast(msg);
}

function createSolo(bots) {
  const name = myName();
  solo = true; role = 'host'; room = 'SOLO';
  H = { started: false, players: [mkPlayer(name, cid)], game: null };
  for (let i = 1; i <= bots; i++) H.players.push(mkPlayer('Bot ' + i, null, true));
  startGame();
}

function createRoom() {
  const name = myName();
  room = rnd(5);
  peer = new Peer('ludo-' + room);
  peer.on('open', () => {
    role = 'host';
    H = { started: false, players: [mkPlayer(name, cid)], game: null };
    $('#lobbyCode').textContent = room;
    show('lobby');
    commit();
  });
  peer.on('connection', c => {
    c.on('data', m => onGuestMsg(c, m));
    c.on('close', () => onGuestClose(c));
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); createRoom(); }
    else if (role === 'host') toast('Network error: ' + e.type);
    else resetNet('Could not create a room (' + e.type + ')');
  });
}

function joinRoom(code) {
  const name = myName();
  room = code;
  peer = new Peer();
  const fail = setTimeout(() => resetNet("Couldn't reach that room"), 12000);
  peer.on('open', () => {
    hostConn = peer.connect('ludo-' + code, { reliable: true });
    hostConn.on('open', () => {
      clearTimeout(fail);
      role = 'guest';
      hostConn.send({ t: 'join', cid, name });
    });
    hostConn.on('data', onHostMsg);
    hostConn.on('close', () => role === 'guest' && resetNet('Host left the room'));
  });
  peer.on('error', e => {
    clearTimeout(fail);
    resetNet(e.type === 'peer-unavailable' ? `Room ${code} not found` : 'Network error: ' + e.type);
  });
}

function onHostMsg(m) {
  if (m.t === 'sync') {
    S = m.st; me = m.you;
    $('#lobbyCode').textContent = room;
    render();
  } else if (m.t === 'err') {
    resetNet(m.m);
  }
}

function onGuestMsg(c, m) {
  if (m.t === 'join') {
    let i = H.players.findIndex(p => p.cid === m.cid);
    if (i < 0) {
      if (H.started) return c.send({ t: 'err', m: 'Game already in progress' });
      if (H.players.length >= 4) return c.send({ t: 'err', m: 'Room is full' });
      H.players.push(mkPlayer(String(m.name).slice(0, 14), m.cid));
    } else {
      H.players[i].connected = true;
    }
    c.cid = m.cid;
    const old = guests.get(m.cid);
    guests.set(m.cid, c);
    if (old && old !== c) try { old.close(); } catch {}
    commit();
    return;
  }
  const i = H.players.findIndex(p => p.cid === c.cid);
  if (i < 0) return;
  if (m.t === 'roll') hostRoll(i);
  else if (m.t === 'move') hostMove(i, m.i);
}

function onGuestClose(c) {
  if (!c.cid || guests.get(c.cid) !== c || !H) return;
  guests.delete(c.cid);
  const i = H.players.findIndex(p => p.cid === c.cid);
  if (i < 0) return;
  if (H.started) H.players[i].connected = false;
  else H.players.splice(i, 1);
  commit();
}

/* ---------------- host logic ---------------- */

function mkPlayer(name, id, bot = false) {
  const used = H ? H.players.map(p => p.color) : [];
  const color = COLOR_ORDER.find(c => !used.includes(c));
  return { name, color, bot, cid: id, connected: true };
}

const pub = () => {
  const st = JSON.parse(JSON.stringify({ started: H.started, players: H.players, game: H.game }));
  st.players.forEach(p => delete p.cid);
  if (st.game) st.game.players.forEach(p => delete p.cid);
  return st;
};

function commit() {
  S = pub(); me = H.players.findIndex(p => p.cid === cid);
  guests.forEach((c, id) => c.open && c.send({ t: 'sync', st: S, you: H.players.findIndex(p => p.cid === id) }));
  render();
  schedule();
}

function schedule() {
  clearTimeout(timer);
  const g = H.game;
  if (!H.started || !g || g.phase === 'over') return;
  const p = g.players[g.turn];
  const auto = p.bot || !p.connected;
  if (g.phase === 'move') {
    if (!Ludo.legalMoves(g).length) timer = setTimeout(() => { Ludo.pass(g); sync(); }, 1300);
    else if (auto) timer = setTimeout(() => hostMove(g.turn, Ludo.botMove(g)), 900);
  } else if (auto) {
    timer = setTimeout(() => hostRoll(g.turn), 900);
  }
}
// game.players aliases H.players after start, so changes to either are the same object
function sync() { commit(); }

function hostRoll(i) {
  const g = H.game;
  if (!g || g.turn !== i) return;
  if (Ludo.roll(g, 1 + Math.floor(Math.random() * 6))) sync();
}
function hostMove(i, tok) {
  const g = H.game;
  if (!g || g.turn !== i) return;
  if (Ludo.move(g, tok)) sync();
}

function startGame() {
  if (H.players.length < 2) return toast('Need at least 2 players (add a bot)');
  H.players.sort((a, b) => a.color - b.color);
  H.game = Ludo.newGame(H.players);
  H.players = H.game.players;
  H.started = true;
  commit();
}

function backToLobby() {
  H.started = false; H.game = null;
  H.players = H.players.filter(p => p.bot || p.connected);
  commit();
}

/* ---------------- board ---------------- */

const SVGNS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent && parent.appendChild(n);
  return n;
};

const PATH = [];
(function () {
  const seg = (c, r, dc, dr, n) => { for (let i = 0; i < n; i++) PATH.push([c + dc * i, r + dr * i]); };
  seg(1, 6, 1, 0, 5); seg(6, 5, 0, -1, 6); seg(7, 0, 1, 0, 2); seg(8, 1, 0, 1, 5);
  seg(9, 6, 1, 0, 6); seg(14, 7, 0, 1, 2); seg(13, 8, -1, 0, 5); seg(8, 9, 0, 1, 6);
  seg(7, 14, -1, 0, 2); seg(6, 13, 0, -1, 5); seg(5, 8, -1, 0, 6); seg(0, 7, 0, -1, 2);
})();
const HOME = [
  [1, 2, 3, 4, 5].map(c => [c, 7]),
  [1, 2, 3, 4, 5].map(r => [7, r]),
  [13, 12, 11, 10, 9].map(c => [c, 7]),
  [13, 12, 11, 10, 9].map(r => [7, r]),
];
const QUAD = [[0, 0], [9, 0], [9, 9], [0, 9]];
const SLOT = [[2, 2], [4, 2], [2, 4], [4, 4]];
const FIN_OFF = [[-.75, 0], [0, -.75], [.75, 0], [0, .75]];

function drawBoard() {
  const svg = $('#board');
  svg.innerHTML = '';
  const bg = el('g', {}, svg);
  QUAD.forEach(([qx, qy], c) => {
    el('rect', { x: qx, y: qy, width: 6, height: 6, fill: COLOR_HEX[c], id: 'quad' + c }, bg);
    el('rect', { x: qx + .9, y: qy + .9, width: 4.2, height: 4.2, rx: .35, fill: '#fff' }, bg);
    SLOT.forEach(([sx, sy]) => {
      el('circle', { cx: qx + sx, cy: qy + sy, r: .6, fill: '#fff', stroke: COLOR_HEX[c], 'stroke-width': .12 }, bg);
      el('circle', { cx: qx + sx, cy: qy + sy, r: .36, fill: COLOR_HEX[c], opacity: .22 }, bg);
    });
  });
  const cell = (c, r, fill) => el('rect', { x: c, y: r, width: 1, height: 1, fill, stroke: '#7c7c8a', 'stroke-width': .04 }, bg);
  const star = (c, r, fill) => el('polygon', {
    points: Array.from({ length: 10 }, (_, k) => {
      const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? .17 : .38;
      return `${(c + .5 + Math.cos(a) * rad).toFixed(3)},${(r + .52 + Math.sin(a) * rad).toFixed(3)}`;
    }).join(' '), fill,
  }, bg);
  PATH.forEach(([c, r], i) => {
    const start = i % 13 === 0;
    cell(c, r, start ? COLOR_HEX[i / 13] : '#fff');
    if (start) star(c, r, '#fff');
    else if (i % 13 === 8) star(c, r, '#b4b4c2');
  });
  HOME.forEach((cells, c) => cells.forEach(([x, y]) => cell(x, y, COLOR_HEX[c])));
  // entry arrows on the cell that leads into each home column
  [[0, 7, 0], [7, 0, 90], [14, 7, 180], [7, 14, 270]].forEach(([c, r, rot], k) => {
    el('path', { d: 'M-.28,-.11 H.03 V-.27 L.3,0 L.03,.27 V.11 H-.28 Z', fill: COLOR_HEX[k],
      transform: `translate(${c + .5} ${r + .5}) rotate(${rot})` }, bg);
  });
  const tri = [
    [[6, 6], [6, 9], [7.5, 7.5]], [[6, 6], [9, 6], [7.5, 7.5]],
    [[9, 6], [9, 9], [7.5, 7.5]], [[6, 9], [9, 9], [7.5, 7.5]],
  ];
  tri.forEach((pts, c) => el('polygon', { points: pts.map(p => p.join(',')).join(' '), fill: COLOR_HEX[c], stroke: '#fff', 'stroke-width': .04 }, bg));
  el('g', { id: 'tokens' }, svg);
}

function tokenXY(color, pos, ti) {
  if (pos === -1) return [QUAD[color][0] + SLOT[ti][0], QUAD[color][1] + SLOT[ti][1]];
  if (pos <= 50) { const [c, r] = PATH[Ludo.abs(color, pos)]; return [c + .5, r + .5]; }
  if (pos < 56) { const [c, r] = HOME[color][pos - 51]; return [c + .5, r + .5]; }
  return [7.5 + FIN_OFF[color][0] * .55, 7.5 + FIN_OFF[color][1] * .55];
}

function renderBoard(g, legal) {
  const layer = $('#tokens');
  const seen = new Set();
  const groups = {};
  g.players.forEach((pl, pi) => g.tokens[pi].forEach((pos, ti) => {
    const [x, y] = tokenXY(pl.color, pos, ti);
    (groups[x + ',' + y] ||= []).push({ pl, pi, ti, pos, x, y });
  }));
  const offs = [[-.2, -.2], [.2, -.2], [-.2, .2], [.2, .2]];
  Object.values(groups).forEach(list => list.forEach((t, k) => {
    const stacked = list.length > 1 && t.pos !== -1;
    const id = `tok-${t.pl.color}-${t.ti}`;
    seen.add(id);
    let node = document.getElementById(id);
    if (!node) {
      node = el('g', { id, class: 'tok' }, layer);
      el('ellipse', { class: 'base', cx: 0, cy: .32, rx: .42, ry: .16 }, node);
      el('ellipse', { cx: 0, cy: .34, rx: .27, ry: .09, fill: '#000', opacity: .28 }, node);
      const pin = el('g', { class: 'pin' }, node);
      el('path', { d: 'M0,.36 C-.1,.22 -.34,.08 -.34,-.14 A.34,.34 0 0 1 .34,-.14 C.34,.08 .1,.22 0,.36 Z',
        fill: COLOR_HEX[t.pl.color], stroke: COLOR_DARK[t.pl.color], 'stroke-width': .07 }, pin);
      el('circle', { cx: 0, cy: -.14, r: .17, fill: '#fff', stroke: COLOR_DARK[t.pl.color], 'stroke-width': .04 }, pin);
      el('circle', { cx: -.14, cy: -.28, r: .06, fill: '#fff', opacity: .6 }, pin);
      node.addEventListener('click', () => onTokenClick(t.pl.color, node));
    }
    node.dataset.ti = t.ti;
    const o = stacked ? offs[k % 4] : [0, 0];
    node.style.transform = `translate(${t.x + o[0]}px, ${t.y + o[1] - .06}px) scale(${stacked ? .74 : 1})`;
    const mine = g.phase === 'move' && g.turn === me && t.pi === me && legal.includes(t.ti);
    node.classList.toggle('movable', mine);
    node.parentNode.appendChild(node); // keep movable/last-updated on top
  }));
  [...layer.children].forEach(n => !seen.has(n.id) && n.remove());
  g.players.forEach(pl => {
    const q = document.getElementById('quad' + pl.color);
    if (q) q.setAttribute('opacity', g.phase !== 'over' && g.players[g.turn] === pl ? 1 : .88);
  });
  for (let c = 0; c < 4; c++) {
    if (!g.players.some(p => p.color === c)) document.getElementById('quad' + c)?.setAttribute('opacity', .15);
  }
}

function onTokenClick(color, node) {
  const g = S && S.game;
  if (!g || g.phase !== 'move' || g.turn !== me || g.players[me].color !== color) return;
  const ti = +node.dataset.ti;
  if (!Ludo.legalMoves(g).includes(ti)) return;
  if (role === 'host') hostMove(me, ti); else hostConn.send({ t: 'move', i: ti });
}

/* ---------------- rendering ---------------- */

function playerRow(p, i, extra = '') {
  const tags = [i === me ? 'you' : '', p.bot ? 'bot' : '', !p.connected ? 'offline' : ''].filter(Boolean).join(' · ');
  return `<div class="pl ${extra}"><span class="dot c${p.color}"></span><span class="name">${esc(p.name)}</span><span class="tag">${tags}</span></div>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const pipsHTML = v => `<span class="pips">${Array.from({ length: 9 }, (_, i) => `<i${(PIPS[v] || []).includes(i) ? ' class="on"' : ''}></i>`).join('')}</span>`;

function renderBadges(g) {
  document.querySelectorAll('.badge').forEach(b => {
    const c = +b.dataset.c;
    const pi = g.players.findIndex(p => p.color === c);
    if (pi < 0) { b.style.visibility = 'hidden'; return; }
    b.style.visibility = 'visible';
    const p = g.players[pi];
    const active = g.phase !== 'over' && g.turn === pi;
    const home = g.tokens[pi].filter(x => x === Ludo.FIN).length;
    const rollable = active && pi === me && g.phase === 'roll';
    const wasActive = b.classList.contains('active');
    b.classList.toggle('active', active);
    const tags = [pi === me ? 'you' : '', p.bot ? 'bot' : '', !p.connected ? 'offline' : ''].filter(Boolean).join(' · ');
    b.innerHTML = `<div class="avatar">${esc([...p.name][0] || '?')}</div>
      <div class="info"><div class="nm">${esc(p.name)}</div><div class="st">🏁 ${home}/4${tags ? ' · ' + tags : ''}</div></div>
      ${active ? `<button class="die${rollable ? ' rollable' : ''}" ${rollable ? '' : 'disabled'} aria-label="Roll dice">${pipsHTML(g.dice)}</button>` : ''}`;
    if (active && g.rolls !== lastRolls && g.dice) b.querySelector('.die').classList.add('shake');
  });
  lastRolls = g.rolls;
}

let lastRolls = 0;
function render() {
  if (!S) return;
  if (!S.started) return renderLobby();
  show('game');
  if (!$('#tokens')) drawBoard();
  const g = S.game;
  const legal = Ludo.legalMoves(g);
  renderBoard(g, legal);
  renderBadges(g);
  $('#msg').textContent = g.msg;
  const myTurn = g.phase !== 'over' && g.turn === me;
  $('#hint').textContent = !myTurn ? '' : g.phase === 'roll' ? 'Your turn — tap your dice' : legal.length ? 'Tap a glowing token' : '';

  const over = g.phase === 'over';
  $('#over').hidden = !over;
  if (over) {
    $('#ranking').innerHTML = g.ranking.map(i => `<li>${i === g.ranking[0] ? '🏆 ' : ''}${esc(g.players[i].name)}</li>`).join('');
    $('#again').hidden = role !== 'host' || solo;
    $('#againWait').hidden = role === 'host';
  }
}

function renderLobby() {
  show('lobby');
  $('#lobbyPlayers').innerHTML = S.players.map((p, i) => {
    const row = playerRow(p, i);
    return role === 'host' && p.bot ? row.replace('</div>', `<button class="x" data-rm="${i}">×</button></div>`) : row;
  }).join('');
  const host = role === 'host';
  $('#hostControls').hidden = !host;
  $('#waitHost').hidden = host;
  $('#addBot').disabled = S.players.length >= 4;
  $('#start').disabled = S.players.length < 2;
}

/* ---------------- wiring ---------------- */

$('#name').value = store.get('ludo.name') || '';
const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom) $('#joinCode').value = urlRoom.toUpperCase().slice(0, 5);

$('#create').onclick = createRoom;
$('#join').onclick = () => {
  const code = $('#joinCode').value.trim().toUpperCase();
  if (code.length !== 5) return toast('Enter the 5-character room code');
  joinRoom(code);
};
$('#joinCode').addEventListener('keydown', e => e.key === 'Enter' && $('#join').click());
$('#copy').onclick = async () => {
  const url = `${location.origin}${location.pathname}?room=${room}`;
  try { await navigator.clipboard.writeText(url); toast('Invite link copied'); } catch { toast(url); }
};
$('#addBot').onclick = () => {
  const n = H.players.filter(p => p.bot).length + 1;
  H.players.push(mkPlayer('Bot ' + n, null, true));
  commit();
};
$('#lobbyPlayers').onclick = e => {
  const i = e.target.dataset && e.target.dataset.rm;
  if (i != null && role === 'host') { H.players.splice(+i, 1); commit(); }
};
$('#start').onclick = startGame;
$('#boardWrap').addEventListener('click', e => {
  if (!e.target.closest('.die.rollable')) return;
  if (role === 'host') hostRoll(me); else hostConn.send({ t: 'roll' });
});
const pick = id => { $('#friendsPanel').hidden = id !== 'friends'; $('#cpuPanel').hidden = id !== 'cpu';
  $('#tileFriends').classList.toggle('on', id === 'friends'); $('#tileComputer').classList.toggle('on', id === 'cpu'); };
$('#tileFriends').onclick = () => pick('friends');
$('#tileComputer').onclick = () => pick('cpu');
$('#cpuPanel').onclick = e => { const n = e.target.dataset && e.target.dataset.bots; if (n) createSolo(+n); };
$('#leaveOver').onclick = () => resetNet();
if (urlRoom) pick('friends');
$('#again').onclick = backToLobby;
const leave = () => resetNet();
$('#leaveLobby').onclick = leave;
$('#leaveGame').onclick = () => confirm('Leave this game?') && leave();
</script>
</body>
</html>
